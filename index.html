<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><style>body{margin:0;font-family:'Pretendard','Noto Sans KR',Helvetica,sans-serif;color:#4a1a22;background:#fbf1ec}a{color:#4a1a22;text-decoration:none}a:hover{color:#c4505c}</style></helmet>
<div style="position:fixed;inset:0;z-index:100;background:#e0707a;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;color:#fff;opacity:{{ loaderOpacity }};visibility:{{ loaderVisibility }};transition:opacity .6s ease,visibility .6s"><div style="font-weight:800;font-size:22px;letter-spacing:.3em">Hongryeon Island</div><div style="font-size:14px;letter-spacing:.2em">LOADING…</div></div>
<div style="display:flex;flex-direction:column;min-height:100vh">
  <div style="display:flex;justify-content:flex-end;align-items:center;gap:26px;height:40px;padding:0 48px;border-bottom:1px solid #ecd5d0;font-size:12px;letter-spacing:.08em;color:#9a6f72">
    <a href="#" style="color:#9a6f72">LOGIN</a><a href="#" style="color:#9a6f72">JOIN</a><a href="#" style="color:#9a6f72">CART 0</a><a href="#" style="color:#9a6f72">ORDER</a><a href="#" style="color:#9a6f72">MY PAGE</a><span>한국어</span>
  </div>
  <div style="display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:88px;padding:0 clamp(16px,5vw,100px);gap:16px">
    
    <a href="#" style="font-weight: 800; font-size: clamp(16px,1.6vw,22px); letter-spacing: .2em; white-space: nowrap; font-family: Pretendard">Hongryeon Island</a><nav style="display:flex;gap:clamp(14px,2.4vw,44px);font-weight:600;font-size:clamp(12px,1.1vw,16px);letter-spacing:.1em;white-space:nowrap">
      <a href="#">SHOP</a><a href="#">REVIEW</a><a href="#">PRESS</a><a href="#">BRAND</a><a href="#">C/S CENTER</a>
    </nav>
    <div></div>
  </div>
  <section style="position:relative;width:100%;height:calc(100vh - 128px);min-height:560px;max-height:860px;background:radial-gradient(circle at 50% 45%,#f4a3a6,#e0707a 50%,#b8384a);overflow:hidden">
    <iframe src="floating/Floating_Prototype.html" title="floating products" style="position:absolute;inset:0;width:100%;height:100%;border:0;display:block"></iframe>
    </section>
  <section style="display:flex;flex-direction:column;align-items:center;text-align:center;padding:clamp(56px,9vw,120px) 24px;gap:0">
    <div style="font-size:13px;font-weight:700;letter-spacing:.12em">HONGRYEON ISLAND</div>
    <h2 style="margin:18px 0 0;font-size:clamp(28px,3.4vw,52px);font-weight:300;line-height:1.35;letter-spacing:-.02em">피부와 세상을 변화시키는<br>매일의 힘, 홍련섬</h2>
    <p style="margin:40px 0 0;font-size:15px;line-height:1.9;color:#8a5f64;font-weight:300">지친 하루의 끝, 나를 웃음 짓게 하는 소소한 행복처럼 삶의 휴식이 필요한 당신에게<br>피부를 위한 다정한 쉬어감을 제안합니다.</p>
    <p style="margin:24px 0 0;font-size:15px;line-height:1.9;color:#8a5f64;font-weight:300">건강한 원료들이 전하는 따스한 토닥임으로 오늘도 홍련섬과 함께하세요.</p>
  </section>
</div>
</x-dc>
<script data-dc-script>class Component extends DCLogic {
  state = { ready: false };
  componentDidMount() {
    this._h = (e) => { if (e.data === "hero-ready") this.setState({ ready: true }); };
    window.addEventListener("message", this._h);
    this._t = setTimeout(() => this.setState({ ready: true }), 20000);
  }
  componentWillUnmount() { window.removeEventListener("message", this._h); clearTimeout(this._t); }
  renderVals() { return { loaderOpacity: this.state.ready ? 0 : 1, loaderVisibility: this.state.ready ? "hidden" : "visible" }; }
}</script></body>
</html>
